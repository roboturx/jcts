<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otopark Kullanımı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Otopark Kullanımı</h1>
        <table class="table">
            <thead>
                <tr>
                    <th>Alan</th>
                    <th>Metin</th>
                </tr>
            </thead>
            <tbody>
                {% for usage in usages %}
                <tr>
                    <td>{{ usage.alan }}</td>
                    <td>{{ usage.text }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Ana Menüye Dön</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
