<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yeni Abone Kaydı</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Yeni Abone Kaydı</h1>
        <form method="POST">
            <div class="mb-3">
                <label for="plaka" class="form-label">Plaka</label>
                <input type="text" class="form-control" id="plaka" name="plaka" required>
            </div>
            <div class="mb-3">
                <label for="name" class="form-label">Ad</label>
                <input type="text" class="form-control" id="name" name="name" required>
            </div>
            <div class="mb-3">
                <label for="surname" class="form-label">Soyad</label>
                <input type="text" class="form-control" id="surname" name="surname" required>
            </div>
            <div class="mb-3">
                <label for="tel" class="form-label">Telefon</label>
                <input type="text" class="form-control" id="tel" name="tel" required>
            </div>
            <div class="mb-3">
                <label for="eposta" class="form-label">E-posta</label>
                <input type="email" class="form-control" id="eposta" name="eposta" required>
            </div>
            <div class="mb-3">
                <label for="arac_marka" class="form-label">Araç Marka</label>
                <input type="text" class="form-control" id="arac_marka" name="arac_marka" required>
            </div>
            <div class="mb-3">
                <label for="passw" class="form-label">Şifre</label>
                <input type="password" class="form-control" id="passw" name="passw" required>
            </div>
            <div class="mb-3">
                <label for="gun_sayisi" class="form-label">Gün Sayısı</label>
                <input type="number" class="form-control" id="gun_sayisi" name="gun_sayisi" required>
            </div>
            <button type="submit" class="btn btn-primary">Kayıt</button>
        </form>
        <a href="{{ url_for('index') }}" class="btn btn-secondary mt-3">Ana Menüye Dön</a>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
